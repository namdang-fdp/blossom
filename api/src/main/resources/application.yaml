spring:
  application:
    name: no-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
"no":
  storage:
    endpoint: ${NO_STORAGE_ENDPOINT}
    region: ${NO_STORAGE_REGION:us-east-1}
    access-key: ${NO_STORAGE_ACCESS_KEY}
    secret-key: ${NO_STORAGE_SECRET_KEY}
    bucket: ${NO_STORAGE_BUCKET:no-media}
jobrunr:
  database:
    skip-create: false
    table-prefix: jobs.
  background-job-server:
    enabled: true
    worker-count: ${NO_JOB_WORKERS:2}
  dashboard:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
server:
  port: ${SERVER_PORT:8082}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
