openapi: 3.0.3
info:
  title: Nở API
  version: 0.0.1
  description: Scaffold contract. Sync và private APIs được định nghĩa trong NO-003.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Kiểm tra tiến trình API
      description: Kiểm tra DB qua /actuator/health/readiness.
      responses:
        '200':
          description: Tiến trình đang chạy
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service:
                    type: string
                    enum: [no-api]
                  status:
                    type: string
                    enum: [UP]
